name: PR

on:
  pull_request:
    branches: [ "main" ]

env:
  files: >-
    src/train_model.py
    src/monitor_model.py
    src/gx_validation.py

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Requirements
        run: |
          pip install -r src/requirements.txt

      - uses: iterative/setup-cml@v1

      - name: pre-Evaluation
        run: |
          python3 src/gx_validation.py --csv london_weather.csv

      - name: pre-PR message
        run: |
          cat output/metrics.json > report.md
          cml comment create report.md
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN  }}

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
          message: |
            New PR! :wave:

      - name: Requirements
        run: |
          pip install black

      - name: black validation
        run: |
          echo "Files to be tracked: $files"
          python -m black --check $filesss
